name: Nilo Health
description: >-
  Nilo Health (nilo.health) is a Berlin-based employee mental health platform
  that helps businesses support their workforce's mental well-being. Founded in
  2019 by Ines Raeth, Catalina Turlea and Jonas Keil, nilo gives teams access to
  500+ psychologists for 1:1 video counseling in 50+ languages, alongside
  self-guided digital programs, group roundtables, and an HR analytics
  dashboard. It is delivered to employers as a company benefit (SaaS) rather than
  through a public developer API; there is no published developer portal, API
  reference, SDKs, or OpenAPI at this time. nilo integrates with HR platforms
  such as Personio and Lano via partner marketplaces, and publishes a trust
  center citing ISO/IEC 27001. The company is backed by Speedinvest and was
  added to the API Evangelist network as a Speedinvest portfolio company.
